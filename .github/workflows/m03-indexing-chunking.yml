name: M03 indexing and chunking evaluation

on:
  push:
    branches:
      - feat/m03-indexing-chunking
    paths-ignore:
      - labs/03_indexing_chunking/results/phase1.json
      - labs/03_indexing_chunking/results/phase1.md
  pull_request:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with regression-test extras
        run: python -m pip install -e ".[dev,neural,pretrained]"
      - name: Run test suite
        run: pytest -q
      - name: Evaluate chunking strategies
        run: python labs/03_indexing_chunking/run.py
      - name: Persist phase-1 evidence on feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/03_indexing_chunking/results/phase1.json
          git add labs/03_indexing_chunking/results/phase1.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M03 chunking phase-1 evaluation [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
