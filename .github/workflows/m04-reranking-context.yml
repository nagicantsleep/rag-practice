name: M04 reranking and context evaluation

on:
  push:
    branches:
      - feat/m04-reranking-context
    paths-ignore:
      - labs/04_reranking_context/results/phase1.json
      - labs/04_reranking_context/results/phase1.md
      - labs/04_reranking_context/results/phase2.json
      - labs/04_reranking_context/results/phase2.md
      - labs/04_reranking_context/results/depth_sweep.json
      - labs/04_reranking_context/results/depth_sweep.md
  pull_request:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-m04-${{ runner.os }}-cross-c5f2b386-flan-0fc9ddf
      - name: Install project with pretrained evaluation extras
        run: python -m pip install -e ".[dev,neural,pretrained]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate frozen-candidate cross-encoder and context policies
        run: python labs/04_reranking_context/run_phase1.py
      - name: Evaluate LLM reranking, ordering, and answer quality
        run: python labs/04_reranking_context/run_phase2.py
      - name: Evaluate candidate-depth latency quality trade-off
        run: python labs/04_reranking_context/run_depth_sweep.py
      - name: Persist M04 evaluation evidence on feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/04_reranking_context/results/phase1.json
          git add labs/04_reranking_context/results/phase1.md
          git add labs/04_reranking_context/results/phase2.json
          git add labs/04_reranking_context/results/phase2.md
          git add labs/04_reranking_context/results/depth_sweep.json
          git add labs/04_reranking_context/results/depth_sweep.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M04 reranking and generation evaluation [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
