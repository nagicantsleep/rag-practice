name: M05 query transformation evaluation

on:
  push:
    branches:
      - feat/m05-query-transformation
    paths-ignore:
      - labs/05_query_transform/results/baseline.json
      - labs/05_query_transform/results/baseline.md
      - labs/05_query_transform/results/capacity_base.json
      - labs/05_query_transform/results/capacity_base.md
      - labs/05_query_transform/results/m05_summary.md
  pull_request:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-m05-${{ runner.os }}-flan-small-0fc9ddf-flan-base-7bcac57-minilm-1c82ace
      - name: Install project with pretrained evaluation extras
        run: python -m pip install -e ".[dev,neural,pretrained]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate query transformations with FLAN-T5-small
        run: python labs/05_query_transform/run.py
      - name: Evaluate transformer capacity control with FLAN-T5-base
        env:
          M05_FLAN_MODEL: google/flan-t5-base
          M05_FLAN_REVISION: 7bcac572ce56db69c1ea7c8af255c5d7c9672fc2
          M05_OUTPUT_STEM: capacity_base
        run: python labs/05_query_transform/run.py
      - name: Persist M05 evaluation evidence on feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/05_query_transform/results/baseline.json
          git add labs/05_query_transform/results/baseline.md
          git add labs/05_query_transform/results/capacity_base.json
          git add labs/05_query_transform/results/capacity_base.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M05 capacity-control evaluation [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
