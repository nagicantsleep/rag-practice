name: M06 adaptive and corrective RAG evaluation

on:
  push:
    branches:
      - feat/m06-adaptive-corrective-rag
    paths-ignore:
      - labs/06_adaptive_corrective/results/control.json
      - labs/06_adaptive_corrective/results/control.md
  pull_request:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate adaptive routing and corrective retrieval
        run: python labs/06_adaptive_corrective/run_control.py
      - name: Persist M06 phase-1 evidence on feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/06_adaptive_corrective/results/control.json
          git add labs/06_adaptive_corrective/results/control.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M06 adaptive control evaluation [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
