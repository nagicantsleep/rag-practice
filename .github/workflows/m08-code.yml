name: M08 Code RAG evaluation

on:
  push:
    branches:
      - feat/m08-code-rag
    paths:
      - "src/rag_practice/code_rag/**"
      - "src/rag_practice/evaluation/code_rag.py"
      - "benchmarks/m08_code/**"
      - "labs/08_specialized_sources/code/**"
      - "tests/test_m08_code_rag.py"
      - ".github/workflows/m08-code.yml"
      - "ROADMAP.md"
  pull_request:
    paths:
      - "src/rag_practice/code_rag/**"
      - "src/rag_practice/evaluation/code_rag.py"
      - "benchmarks/m08_code/**"
      - "labs/08_specialized_sources/code/**"
      - "tests/test_m08_code_rag.py"
      - ".github/workflows/m08-code.yml"
      - "ROADMAP.md"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with full regression-test dependencies
        run: python -m pip install -e ".[dev,neural,pretrained]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate Code RAG
        run: python labs/08_specialized_sources/code/run.py
      - name: Persist Code RAG evaluation evidence on feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/08_specialized_sources/code/results/results.json labs/08_specialized_sources/code/results/results.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M08 Code RAG evaluation [skip ci]"
            git push origin HEAD:feat/m08-code-rag
          fi
