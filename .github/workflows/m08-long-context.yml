name: M08 long-context routing evaluation

on:
  push:
    branches:
      - feat/m08-long-context-routing
    paths:
      - "src/rag_practice/long_context/**"
      - "src/rag_practice/evaluation/long_context.py"
      - "benchmarks/m08_long_context/**"
      - "labs/08_specialized_sources/long_context/**"
      - "tests/test_m08_long_context.py"
      - "tests/test_m08_long_context_smollm.py"
      - ".github/workflows/m08-long-context.yml"
      - "pyproject.toml"
      - "ROADMAP.md"
  pull_request:
    paths:
      - "src/rag_practice/long_context/**"
      - "src/rag_practice/evaluation/long_context.py"
      - "benchmarks/m08_long_context/**"
      - "labs/08_specialized_sources/long_context/**"
      - "tests/test_m08_long_context.py"
      - "tests/test_m08_long_context_smollm.py"
      - ".github/workflows/m08-long-context.yml"
      - "pyproject.toml"
      - "ROADMAP.md"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project regression dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate deterministic long-context routing
        run: python labs/08_specialized_sources/long_context/run.py
      - name: Persist long-context evaluation evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            labs/08_specialized_sources/long_context/results/results.json \
            labs/08_specialized_sources/long_context/results/results.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M08.7 long-context evaluation [skip ci]"
            git push origin HEAD:feat/m08-long-context-routing
          fi
