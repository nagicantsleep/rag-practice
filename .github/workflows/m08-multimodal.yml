name: M08 multimodal RAG evaluation

on:
  push:
    branches:
      - feat/m08-multimodal-rag
    paths:
      - "src/rag_practice/multimodal/**"
      - "src/rag_practice/evaluation/multimodal.py"
      - "benchmarks/m08_multimodal/**"
      - "labs/08_specialized_sources/multimodal/**"
      - "tests/test_m08_multimodal.py"
      - ".github/workflows/m08-multimodal.yml"
      - "ROADMAP.md"
  pull_request:
    paths:
      - "src/rag_practice/multimodal/**"
      - "src/rag_practice/evaluation/multimodal.py"
      - "benchmarks/m08_multimodal/**"
      - "labs/08_specialized_sources/multimodal/**"
      - "tests/test_m08_multimodal.py"
      - ".github/workflows/m08-multimodal.yml"
      - "ROADMAP.md"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with full regression-test dependencies
        run: python -m pip install -e ".[dev,neural,pretrained]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate deterministic multimodal RAG
        run: python labs/08_specialized_sources/multimodal/run.py
      - name: Evaluate pinned pretrained CLIP retrieval control
        run: python labs/08_specialized_sources/multimodal/run_clip.py
      - name: Persist multimodal evaluation evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            labs/08_specialized_sources/multimodal/results/results.json \
            labs/08_specialized_sources/multimodal/results/results.md \
            labs/08_specialized_sources/multimodal/results/clip_results.json \
            labs/08_specialized_sources/multimodal/results/clip_results.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M08 multimodal evaluation [skip ci]"
            git push origin HEAD:feat/m08-multimodal-rag
          fi
