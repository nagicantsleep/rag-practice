name: M08 Web RAG evaluation

on:
  push:
    branches:
      - feat/m08-web-rag
    paths-ignore:
      - labs/08_specialized_sources/web/results/results.json
      - labs/08_specialized_sources/web/results/results.md
  pull_request:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with full regression-test dependencies
        run: python -m pip install -e ".[dev,neural,pretrained]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate Web RAG source selection and freshness
        run: python labs/08_specialized_sources/web/run.py
      - name: Persist Web RAG evaluation evidence on feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/08_specialized_sources/web/results/results.json
          git add labs/08_specialized_sources/web/results/results.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M08 Web RAG evaluation [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
