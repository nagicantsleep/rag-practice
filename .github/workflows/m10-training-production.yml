name: M10 training and production evaluation

on:
  push:
    branches:
      - feat/m10-training-production-rag
    paths:
      - "src/rag_practice/training/**"
      - "src/rag_practice/production/**"
      - "src/rag_practice/evaluation/training.py"
      - "src/rag_practice/evaluation/production.py"
      - "benchmarks/m10_training/**"
      - "benchmarks/m10_production/**"
      - "labs/10_training_production/**"
      - "tests/test_m10_training.py"
      - "tests/test_m10_production.py"
      - ".github/workflows/m10-training-production.yml"
      - "pyproject.toml"
      - "ROADMAP.md"
  pull_request:
    paths:
      - "src/rag_practice/training/**"
      - "src/rag_practice/production/**"
      - "src/rag_practice/evaluation/training.py"
      - "src/rag_practice/evaluation/production.py"
      - "benchmarks/m10_training/**"
      - "benchmarks/m10_production/**"
      - "labs/10_training_production/**"
      - "tests/test_m10_training.py"
      - "tests/test_m10_production.py"
      - ".github/workflows/m10-training-production.yml"
      - "pyproject.toml"
      - "ROADMAP.md"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with full regression dependencies
        run: python -m pip install -e ".[dev,pretrained,visual_document]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate pinned M10.1 retriever training controls
        run: python labs/10_training_production/run_training.py
      - name: Persist M10 evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            labs/10_training_production/results/training_results.json \
            labs/10_training_production/results/training_results.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M10 training evaluation [skip ci]"
            git push origin HEAD:feat/m10-training-production-rag
          fi
