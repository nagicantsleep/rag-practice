name: M11 O2C logistics capstone evaluation

on:
  push:
    branches:
      - feat/m11-otc-logistics-capstone
    paths:
      - "src/rag_practice/otc/**"
      - "src/rag_practice/evaluation/otc*.py"
      - "benchmarks/m11_otc_logistics/**"
      - "labs/11_otc_logistics/**"
      - "tests/test_m11_otc.py"
      - ".github/workflows/m11-otc.yml"
      - "pyproject.toml"
      - "ROADMAP.md"
  pull_request:
    paths:
      - "src/rag_practice/otc/**"
      - "src/rag_practice/evaluation/otc*.py"
      - "benchmarks/m11_otc_logistics/**"
      - "labs/11_otc_logistics/**"
      - "tests/test_m11_otc.py"
      - ".github/workflows/m11-otc.yml"
      - "pyproject.toml"
      - "ROADMAP.md"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with full regression dependencies
        run: python -m pip install -e ".[dev,pretrained,visual_document]"
      - name: Run full test suite
        run: pytest -q
      - name: Evaluate frozen M11.1 baselines
        run: python labs/11_otc_logistics/run_baselines.py
      - name: Evaluate frozen M11.2 integrated copilot
        run: python labs/11_otc_logistics/run_integrated.py
      - name: Evaluate frozen M11.3 production serving
        run: python labs/11_otc_logistics/run_production.py
      - name: Persist M11 evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            labs/11_otc_logistics/results/baseline_results.json \
            labs/11_otc_logistics/results/baseline_results.md \
            labs/11_otc_logistics/results/integrated_results.json \
            labs/11_otc_logistics/results/integrated_results.md \
            labs/11_otc_logistics/results/production_results.json \
            labs/11_otc_logistics/results/production_results.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record M11 evaluation evidence [skip ci]"
          fi
      - name: Mark M11 complete after successful source-of-truth gate
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("labs/11_otc_logistics/README.md")
          text = readme.read_text()
          old_status = "Status: **CHARTER FROZEN — BENCHMARK CONSTRUCTION NEXT**"
          if old_status not in text:
              raise SystemExit("expected M11 README status not found")
          text = text.replace(old_status, "Status: **DONE**", 1)

          old_dod = '''- [x] Capstone use case and product objective frozen before implementation.
          - [x] Required source families and task classes frozen before implementation.
          - [x] Evaluation axes and phase boundaries frozen before implementation.
          - [ ] Construct versioned realistic ERP / finance / logistics / contract / SOP dataset.
          - [ ] Freeze benchmark instances, qrels, expected answers, permissions, source versions, mutations, and evaluation rules before model/prompt optimization.
          - [ ] Implement and evaluate explicit baselines.
          - [ ] Implement integrated mixed-source copilot with bounded planning / retrieval loop.
          - [ ] Enforce ACL, freshness, trust, and no-evidence behavior before answer generation.
          - [ ] Persist exact citations, records, tool actions, observations, and per-stage traces.
          - [ ] Add incremental ingestion, mutation-aware cache invalidation, and regression tests.
          - [ ] Measure quality, security, freshness, latency, cost, and scale separately.
          - [ ] Inspect and retain representative failures instead of tuning them away post-hoc.
          - [ ] Pass final source-of-truth CI gate and document findings / trade-offs.'''
          new_dod = '''- [x] Capstone use case and product objective frozen before implementation.
          - [x] Required source families and task classes frozen before implementation.
          - [x] Evaluation axes and phase boundaries frozen before implementation.
          - [x] Construct versioned realistic ERP / finance / logistics / contract / SOP dataset.
          - [x] Freeze benchmark instances, qrels, expected answers, permissions, source versions, mutations, and evaluation rules before model/prompt optimization.
          - [x] Implement and evaluate explicit baselines.
          - [x] Implement integrated mixed-source copilot with bounded planning / retrieval loop.
          - [x] Enforce ACL, freshness, trust, and no-evidence behavior before answer generation.
          - [x] Persist exact citations, records, tool actions, observations, and per-stage traces.
          - [x] Add incremental ingestion, mutation-aware cache invalidation, and regression tests.
          - [x] Measure quality, security, freshness, latency, cost, and scale separately.
          - [x] Inspect and retain representative failures instead of tuning them away post-hoc.
          - [x] Pass final source-of-truth CI gate and document findings / trade-offs.'''
          if old_dod not in text:
              raise SystemExit("expected M11 DoD block not found")
          text = text.replace(old_dod, new_dod, 1)
          old_next = '''## Immediate next step

          Build **M11.0 dataset + benchmark only**. Do not implement the optimized retrieval / agent pipeline until the benchmark instances and integrity rules have been frozen in a separate commit.'''
          new_next = '''## Completion

          M11 is complete. The frozen benchmark, baseline evidence, integrated-copilot evidence, production-serving evidence, retained failures, and final source-of-truth gate are recorded in this lab and its result artifacts.'''
          if old_next not in text:
              raise SystemExit("expected M11 README next-step block not found")
          readme.write_text(text.replace(old_next, new_next, 1))

          roadmap = Path("ROADMAP.md")
          road = roadmap.read_text()
          old_road = '''### M11 — Order-to-Cash & Logistics Exception Resolution Copilot — `TODO`

          M11 is the real-world production RAG capstone. It integrates ERP/order data, finance state, logistics/TMS events, contracts/SLA, operational SOPs, authorization, retrieval/reranking, bounded agentic investigation, freshness, caching, observability, and exact provenance into one evidence-grounded exception-resolution system.

          The phase-0 charter freezes the product objective, source families, investigation shape, task classes, phase boundaries, evaluation axes, and Definition of Done before optimized M11 system implementation. The actual benchmark instances must be frozen separately after constructing the versioned dataset and before retrieval/prompt/router/agent optimization.

          Artifacts: `labs/11_otc_logistics/` and `benchmarks/m11_otc_logistics/`.

          ## Immediate next step

          Continue **M11.0 — Dataset and Benchmark**. Construct the versioned ERP / finance / logistics / contract / SOP corpus, define held-out operational cases, permissions, source versions, benchmark clock, mutations, qrels, expected answers, and evaluator rules, then freeze those instances in a separate commit before implementing the optimized M11 retrieval or agent pipeline.'''
          new_road = '''### M11 — Order-to-Cash & Logistics Exception Resolution Copilot — `DONE`

          M11 is the real-world production RAG capstone integrating ERP/order state, finance, logistics events, contracts/SLA, SOPs, authorization, bounded investigation, freshness, caching, mutation handling, observability, and exact provenance.

          Key findings:

          - the fixed one-shot mixed-source baseline reaches strict task success `0.500`, field accuracy `0.856`, and high source recall, but exposes stale and untrusted evidence on the frozen benchmark;
          - the repaired bounded integrated copilot reaches strict task success `0.889`, field accuracy `0.972`, evidence recall `0.986`, and zero unauthorized/stale/untrusted exposure while keeping two evaluator/policy mismatches as retained failures rather than tuning them away;
          - generation-aware role/snapshot/policy cache keys preserve serving correctness across authorized/denied users and the frozen g0→g1 Helios mutation;
          - the M11.3 production sequence reaches perfect cache expectation, role isolation, generation invalidation, mutation correctness, and observability completeness with zero policy exposure;
          - deterministic 100/1000-record expansions preserve the target answer, but latency/scale numbers remain educational Python/GitHub-Actions sanity measurements rather than database, ANN, concurrency, or production-throughput claims.

          Evaluation evidence:

          - M11.0 benchmark freeze: `96031c933f6b53b22fb50f0ca02e723a0d928aa1`;
          - M11.1 baseline gate: `32518642131` / job `96885807414`;
          - repaired M11.2 gate: `32558363822` / job `96996006860`, with **161 repository tests** passing;
          - M11.3 production gate: `32558661583` / job `96996711770`, with **164 repository tests** plus all M11 evaluators passing;
          - the final source-of-truth push gate passes on the completed code/evidence/workflow head immediately before this automated `[skip ci]` completion update.

          Artifacts: `benchmarks/m11_otc_logistics/`, `src/rag_practice/otc/`, `src/rag_practice/evaluation/otc.py`, `src/rag_practice/evaluation/otc_integrated.py`, `src/rag_practice/evaluation/otc_production.py`, `labs/11_otc_logistics/`, and `.github/workflows/m11-otc.yml`.

          ## Immediate next step

          M00–M11 are complete. Any next milestone should begin with a new learning objective and a frozen evaluation contract rather than extending the completed M11 benchmark post-hoc.'''
          if old_road not in road:
              raise SystemExit("expected M11 ROADMAP block not found; refusing broad rewrite")
          roadmap.write_text(road.replace(old_road, new_road, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md labs/11_otc_logistics/README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: mark M11 complete [skip ci]"
          fi
      - name: Push persisted evidence and completion
        if: github.event_name == 'push'
        run: |
          git push origin HEAD:feat/m11-otc-logistics-capstone
