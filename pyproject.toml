[project]
name = "rag-practice"
version = "0.1.0"
description = "Learn RAG from first principles, then evolve it into Agentic RAG"
requires-python = ">=3.11"
dependencies = [
  "qdrant-client>=1.15.0",
  "sentence-transformers>=5.0.0",
  "pypdf>=5.0.0",
  "ollama>=0.5.0",
]

[project.scripts]
rag-practice = "rag_practice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_practice"]
