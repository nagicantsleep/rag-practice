[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-practice"
version = "0.1.0"
description = "Hands-on implementations for learning retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
neural = ["torch>=2.0"]
pretrained = ["sentence-transformers==5.6.1"]
colbert = ["pylate==1.6.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_practice"]
